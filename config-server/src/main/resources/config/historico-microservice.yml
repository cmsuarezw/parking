spring:
    datasource:
        url: ${SPRING_DB_URL}
        username: ${SPRING_DB_USER_NAME}
        password: ${SPRING_DB_PASSWORD}
    jpa:
        show-sql: true
        hibernate:
            ddl-auto: update    
#        properties:
#            hibernate:
#                dialect: org.hibernate.dialect.MySQLDialect
#        properties:
#            hibernate:
#                show_sql: true
#                format_sql: true
#                use_sql_comments: true
#                highlight_sql: true

eureka:
    client:
        enabled: true
        fetchRegistry: true
        registerWithEureka: true
        service-url:
            defaultZone: http://locahost:8761/eureka/
#            defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/} 
    instance:
        preferIpAddress: true
 #       instance-id: ${spring.application.name} #:${spring.application.instance_id:${random.value}}
 #       hostname: localhost


server:
    port: 8093

management: 
    endpoints:
        web:
            exposure:
                include: health, info, prometheus
    endpoint:
        health:
            show-details: always

logging:
    level:
        root: INFO
        com.csuarez.microservices: WARN
        org:
            hibernate:
                type: TRACE
                SQL: DEBUG
                orm:
                    jdbc:
                        bind: TRACE
                springframework:
                    jdbc:
                        core:
                            JdbcTemplate: DEBUG   
    pattern:
        console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %5level %logger{36} - %msg%n'
        file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %5level %logger{36} - %msg%n'
    file: 
        name: logs/historico-microservices.log
        max-size: 1MB
        max-history: 30