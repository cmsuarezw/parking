server:
    port: 8092

spring:
    datasource:
        url: SPRING_DATASOURCE_URL
        username: SPRING_DATASOURCE_USERNAME
        password: SPRING_DATASOURCE_PASSWORD
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: update #none
        database-platform: org.hibernate.dialect.PostgreSQLDialect
#        properties:
#            hibernate:
#                show_sql: true
#                format_sql: true
#                use_sql_comments: true
#                highlight_sql: true
#                validator:
#                apply_to_ddl: false
#                dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
    client:
        enabled: true
        fetchRegistry: true
        registerWithEureka: true
        service-url:
            defaultZone: http://locahost:8761/eureka/
#            defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/} 
    instance:
        preferIpAddress: true
 #       instance-id: ${spring.application.name} #:${spring.application.instance_id:${random.value}}
 #       hostname: localhost
        
#        status-page-url-path: /infoCatalogo
#        health-check-url-path: /healthCatalogo
# o metadataMap:
#        infoCatalogo: "Valor-Personalizado-Del-Catalogo"

#        metadata-map: 
#            app-owner: csuarez
#            description: Vehiculo microservice
#       initial-status: OUT_OF_SERVICE

management: 
    endpoints:
        web:
            exposure:
                include: health, info, prometheus
    endpoint:
        health:
            show-details: always 
            
logging:
    level:
        root: INFO
        com.csuarez.microservices: WARN
    pattern:
        console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %5level %logger{36} - %msg%n'
        file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %5level %logger{36} - %msg%n'
    file: 
        name: logs/vehiculo-microservice.log
        max-size: 1MB
        max-history: 30